services:
  - type: web
    name: career-path
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: career-path-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: career-path-db
    plan: free
