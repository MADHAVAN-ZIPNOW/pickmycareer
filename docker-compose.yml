services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careerpath
      POSTGRES_PASSWORD: careerpath
      POSTGRES_DB: careerpath
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpath"]
      interval: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://careerpath:careerpath@db:5432/careerpath
      JWT_SECRET: change-me-in-production
    ports: ["8010:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./backend/app:/code/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
volumes:
  pgdata:
